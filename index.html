<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
     <header id="header" class="head">

    </header>
    <main>
        <section class="reviews" style="background: black;">
            <div class="container">
                <div class="rev__content">
                    <h2 class="rev__h2" style="font-size: 64px; color: white; text-align:center; margin-bottom: 50px;">
                    Reviews</h2>
                </div>
                <div class="rev__cards" style="display: grid; grid-template-columns: repeat(4, 1fr);">
                    <div style="height: 476px; overflow: hidden;">
                        <img src="./accets/media/images/Reviews__1.png" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div style="height: 476px; overflow: hidden;">
                        <img src="./accets/media/images/Reviews__2.png" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div style="height: 476px; overflow: hidden;">
                        <img src="./accets/media/images/Reviews__3.png" style="width:100%; height: 100%; object-fit: cover;">
                    </div>
                    <div style="height: 476px; overflow: hidden;">
                        <img src="./accets/media/images/Reviews__4.png" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                </div>
            </div>
        </section>
        <section class="adv">
            <div class="container">
                <div class="adv__content">
                    <h2 class="adv__h2">Advantages</h2>
                    <div class="adv__cards">
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>40+ unique cars for <br> rent from our fleet</p>
                        </div>
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>Delivery and return <br> of cars in Dubai 24/7</p>
                        </div>
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>Insurance without a <br> deductible for each car</p>
                        </div>
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>No video or audio <br> recording in the car</p>
                        </div>
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>24/7 technical support</p>
                        </div>
                        <div class="adv__cards-item" style="background-image: url(./accets/media/images/adv__2.jpg);">
                            <p>All models have a premium package</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer id="footer" class="footer">

    </footer>

</body>
</html>
